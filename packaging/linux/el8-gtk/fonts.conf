<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Config for the fontconfig bundled in the AppImage.

  The on-disk cache is an mmap'd binary. Its layout is not stable across
  fontconfig releases: Debian 11 and Ubuntu 20.04 ship 2.13.1, and this
  bundle ships the version pinned in versions.env. Reading
  ~/.cache/fontconfig or /var/cache/fontconfig from the other version can
  crash this process; writing those files can crash host programs that
  later mmap them with the distro fontconfig.

  This file therefore does not include the host fonts.conf (that is where
  the host cachedirs are declared). It still uses the host font directories
  and /etc/fonts/conf.d, which holds hinting, antialiasing and family
  aliases and does not declare cachedirs. The only cachedir is a private
  one under the user's XDG cache, which the host fontconfig never reads.

  A user fonts.conf that adds the host cachedir can opt back into the
  shared cache. That is the user's own config.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/usr/share/X11/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <include ignore_missing="yes">/etc/fonts/conf.d</include>
  <include ignore_missing="yes" prefix="xdg">fontconfig/conf.d</include>
  <include ignore_missing="yes" prefix="xdg">fontconfig/fonts.conf</include>
  <cachedir prefix="xdg">hearthstone-linux-gui/fontconfig</cachedir>
</fontconfig>
