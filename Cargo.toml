[package]
name = "hearthstone-linux-gui"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license = "MIT"
description = "Native GTK4 Linux GUI manager for crafting and launching Hearthstone"

[lib]
name = "hearthstone_linux"
path = "src/lib.rs"

[workspace]
members = [
    ".",
    "crates/stubs/blz-commerce-sdk-plugin",
    "crates/stubs/commerce-http-client",
    "crates/stubs/core-foundation",
    "crates/stubs/native-api-mac",
    "crates/stubs/osx-window-management",
]
default-members = [
    ".",
    "crates/stubs/blz-commerce-sdk-plugin",
    "crates/stubs/commerce-http-client",
    "crates/stubs/core-foundation",
    "crates/stubs/native-api-mac",
    "crates/stubs/osx-window-management",
]
resolver = "2"
# The optional login window has its own workspace and lock file, so nothing
# here depends on WebKitGTK.
exclude = ["login-helper"]

[workspace.package]
version = "0.4.0"
# MSRV matches relm4 0.10.1 (relm4-css / relm4-macros). relm4 0.11 needs
# Rust 1.93 and gtk4 0.11, which would raise this floor and the GTK baseline.
rust-version = "1.92"

[features]
default = ["gui"]
gui = ["dep:relm4", "dep:relm4-components", "dep:gtk4", "dep:libadwaita"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
bitvec = "1.1.1"
cbc = { version = "0.2.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hex = "0.4.3"
md5 = "0.8.1"
pbkdf2 = "0.13.0"
# Stay on 0.12. 0.13 switches rustls to the aws-lc-rs backend (cmake and a C
# toolchain, a risk for the EL8 AppImage and Nix) and to system certificate
# roots instead of webpki-roots, which changes certificate behavior in Flatpak
# and AppImage.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
walkdir = "2.5.0"
xz2 = "0.1.7"

# Pinned. 0.11 needs Rust 1.93 and gtk4 0.11.
relm4 = { version = "=0.10.1", default-features = false, features = ["css", "macros", "libadwaita"], optional = true }
relm4-components = { version = "=0.10.1", features = ["libadwaita"], optional = true }
# Runtime baseline is still GTK 4.6 + libadwaita 1.1 (adw 1.1 needs GTK >= 4.5),
# but we compile against the 4.4 API surface so EL9's pango 1.48 works.
# gtk4-rs 0.10's v4_6 feature enables pango/v1_50, and pango-sys then requires
# pango >= 1.50. EL9 ships pango 1.48.7 (Red Hat's GTK 4.6.9 is built against
# it). Anything needing a 4.6-only API must fail to compile. gtk-rs gates
# newer APIs behind cumulative v4_* / v1_* features, so these direct deps —
# unified with relm4's gtk4 and libadwaita — keep that ceiling. relm4's
# gnome_43+ features are unused; they would raise GTK (and pango) too.
gtk4 = { version = "0.10", features = ["v4_4"], optional = true }
libadwaita = { version = "0.8", features = ["v1_1"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
# examples/blte_bench.rs reuses crates already depended on by the library.
flate2 = { version = "1.1.10", default-features = false }
md5 = "0.8.1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["fs", "rt-multi-thread", "time"] }

[profile.release]
lto = false
codegen-units = 16
opt-level = 2
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "z"
