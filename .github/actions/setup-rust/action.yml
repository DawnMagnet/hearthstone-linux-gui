name: Set up Rust and GTK
description: >
  Install the Rust toolchain pinned in rust-toolchain.toml (1.92.0), restore
  the Cargo cache, and install GTK development packages. Shared by ci.yml
  and login-helper.yml.

inputs:
  apt-packages:
    description: Apt packages to install, in addition to pkg-config.
    required: false
    default: libgtk-4-dev libadwaita-1-dev
  cache-workspaces:
    description: >
      Swatinem/rust-cache workspaces value. Empty caches the repository root.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache-workspaces == ''
      with:
        cache-on-failure: true

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache-workspaces != ''
      with:
        cache-on-failure: true
        workspaces: ${{ inputs.cache-workspaces }}

    # The runner is thrown away afterwards, so skip fsync and man-page
    # indexing while dpkg unpacks the development files.
    - name: Install GTK development packages
      shell: bash
      run: |
        echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/unsafe-io >/dev/null
        sudo rm -f /var/lib/man-db/auto-update
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          pkg-config ${{ inputs.apt-packages }}
