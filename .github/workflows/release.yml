name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dist:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show release context
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"
          docker --version

      - name: Prepare artifact names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_REF_NAME//\//-}"
          echo "artifact_suffix=${suffix}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi

      # Every artifact is built on the Enterprise Linux 9 baseline (glibc 2.34)
      # so it runs on old and new distributions alike; glibc is never bundled.
      # See docs/design/packaging-pipeline.md.
      - name: Build AppImage and native packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist/build release-dist/appimage release-dist/native
          docker build \
            -f packaging/linux/Dockerfile \
            --target dist \
            --output type=local,dest=release-dist/build \
            .
          mv release-dist/build/*.AppImage release-dist/appimage/
          mv release-dist/build/*.deb release-dist/build/*.rpm release-dist/build/*.pkg.tar.zst release-dist/native/
          rmdir release-dist/build
          find -L release-dist -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearthstone-linux-gui-${{ steps.names.outputs.artifact_suffix }}-appimage
          path: release-dist/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Upload native package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hearthstone-linux-gui-${{ steps.names.outputs.artifact_suffix }}-native-packages
          path: |
            release-dist/native/*.deb
            release-dist/native/*.rpm
            release-dist/native/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 90

  # Builds run in parallel; only `publish` touches the GitHub release, so
  # nothing else races on the release, SHA256SUMS.txt or the notes.
  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  publish:
    name: Publish release
    needs: [build-dist, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hearthstone-linux-gui-*
          merge-multiple: true
          path: release-dist

      - name: Check assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.pkg.tar.zst' '*.flatpak'; do
            if [ -z "$(find . -maxdepth 1 -type f -name "$pattern" -print -quit)" ]; then
              echo "Missing release asset matching ${pattern}" >&2
              exit 1
            fi
          done
          # Plain file names, so `sha256sum -c SHA256SUMS.txt` works in the
          # directory the release assets were downloaded to.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## hearthstone-linux-gui artifacts"
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            while IFS= read -r file; do
              echo "| \`${file}\` | $(stat -c '%s' "$file") bytes |"
            done < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      # Hand-written notes in docs/release-notes/<tag>.md win; otherwise a
      # generic download/verification text is generated.
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            cp "docs/release-notes/${TAG}.md" release-notes.md
            exit 0
          fi
          cat > release-notes.md <<EOF
          Automated release for ${TAG}.

          ## Downloads

          - AppImage: portable x86_64 build. Needs glibc 2.34 or newer (RHEL/Alma/Rocky 9, Ubuntu 22.04, Debian 12, Fedora 35 and every newer release); bundles GTK 4/libadwaita, never glibc.
          - DEB/RPM/Pacman: native packages using the system GTK 4 (>= 4.0) and libadwaita (>= 1.0); same glibc 2.34 floor.
          - Flatpak: \`hearthstone-linux-gui-${TAG#v}-x86_64.flatpak\`, sandboxed x86_64 bundle on the GNOME 51 runtime (installed from Flathub automatically). Install with \`flatpak install --user ./hearthstone-linux-gui-${TAG#v}-x86_64.flatpak\`, run with \`flatpak run io.github.hearthstone_linux_gui\`.
          - Nix users can build the native package with \`nix build github:${GITHUB_REPOSITORY}/${TAG}\`.

          ## Verification

          Download \`SHA256SUMS.txt\` from this release and verify with:

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            prerelease_args+=(--prerelease)
          fi

          mapfile -t assets < <(find release-dist -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.flatpak' -o -name 'SHA256SUMS.txt' \) \
            | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
