name: Release

# Only v* tags build everything. Pull requests do not build packages and
# pushes to master run the quick packaging.yml build, so none of them overlap
# with a release (each has its own concurrency group).
#
#   packages    packaging.yml, full distribution matrix  -+
#   flatpak     flatpak.yml                               +-> publish
#   validate    tag matches the Cargo.toml version       -+
#
# Crane vendors crates from Cargo.lock, so packages, flatpak, and publish
# check out github.sha: the commit the v* tag points at, or the ref selected
# for a manual run. validate only compares the tag to Cargo.toml and runs
# alongside the builds.
#
# The builds run in parallel and only upload workflow artifacts. `publish` is
# the single job that touches the GitHub release. A manual run builds
# everything but publishes nothing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sh packaging/cargo-version.sh)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi

  packages:
    name: Packages
    uses: ./.github/workflows/packaging.yml
    with:
      full: true
      ref: ${{ github.sha }}

  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml
    with:
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      ref: ${{ github.sha }}

  publish:
    name: Publish release
    needs: [validate, packages, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download AppImage and native packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-dist

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.flatpak.outputs.artifact }}
          path: release-dist

      - name: Check assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.pkg.tar.zst' '*.flatpak'; do
            if [ -z "$(find . -maxdepth 1 -type f -name "$pattern" -print -quit)" ]; then
              echo "Missing release asset matching ${pattern}" >&2
              exit 1
            fi
          done
          # Plain file names, so `sha256sum -c SHA256SUMS.txt` works in the
          # directory the release assets were downloaded to.
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' \
            | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## hearthstone-linux-gui artifacts"
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            while IFS= read -r file; do
              echo "| \`${file}\` | $(stat -c '%s' "$file") bytes |"
            done < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      # Hand-written notes in docs/release-notes/<tag>.md win; otherwise a
      # generic download/verification text is generated.
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            cp "docs/release-notes/${TAG}.md" release-notes.md
            exit 0
          fi
          cat > release-notes.md <<EOF
          Automated release for ${TAG}.

          ## Downloads

          - AppImage: portable x86_64 build. Needs glibc 2.34 or newer (RHEL/Alma/Rocky 9, Ubuntu 22.04, Debian 12, Fedora 35 and every newer release); bundles GTK 4/libadwaita, never glibc.
          - DEB/RPM/Pacman: native packages using the system GTK 4 (>= 4.0) and libadwaita (>= 1.0); same glibc 2.34 floor.
          - Flatpak: \`hearthstone-linux-gui-${TAG#v}-x86_64.flatpak\`, sandboxed x86_64 bundle on the GNOME 51 runtime (installed from Flathub automatically). Install with \`flatpak install --user ./hearthstone-linux-gui-${TAG#v}-x86_64.flatpak\`, run with \`flatpak run io.github.hearthstone_linux_gui\`.
          - Nix users can build the native package with \`nix build github:${GITHUB_REPOSITORY}/${TAG}\`.

          ## Verification

          Download \`SHA256SUMS.txt\` from this release and verify with:

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then
            prerelease_args+=(--prerelease)
          fi

          mapfile -t assets < <(find release-dist -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.flatpak' -o -name 'SHA256SUMS.txt' \) \
            | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
