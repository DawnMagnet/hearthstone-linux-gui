name: Cargo hash

# Computes flake.nix's cargoHash and, when it is stale, commits the fix
# before release packaging starts. The hash is the recursive NAR hash of
# fetchCargoVendor's vendor staging (Cargo.lock plus the crates.io tarballs
# named in Cargo.lock). .github/scripts/cargo-hash.py downloads those
# tarballs and hashes the tree. It does not run nix build, and it does not
# build the application, the AppImage, or the Flatpak.
#
# Tag release (push of v*): the fix is a new commit on top of the tagged
# commit, changing only flake.nix. The v* tag is force-moved onto that
# commit so `nix build github:<repo>/<tag>` sees the hash that matches the
# tag's Cargo.lock. Annotated tags are recreated unsigned with the same
# subject; this token cannot re-sign them. The branch the tag was cut from
# is not updated, so master may keep a stale hash until the next release
# (a one-off master fix can still land separately).
#
# The push uses the workflow GITHUB_TOKEN, which does not start another
# release run. This run keeps going. release.yml passes the resulting sha
# into packaging and Flatpak, and those jobs check that commit out.
#
# Manual run on a branch: the same commit is fast-forwarded onto that
# branch (not force-pushed). packaging.yml ignores flake.nix, so the push
# does not start a second packaging workflow.

on:
  workflow_call:
    outputs:
      sha:
        description: Commit packaging should check out.
        value: ${{ jobs.update.outputs.sha }}
      changed:
        description: True when flake.nix was updated and pushed.
        value: ${{ jobs.update.outputs.changed }}

permissions:
  contents: write

jobs:
  update:
    name: Refresh cargoHash
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The triggering ref, not the event sha, so a re-run fetches the
          # tag this job already moved and does not commit the same fix twice.
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Compute cargoHash
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          computed="$(python3 .github/scripts/cargo-hash.py)"
          if [[ ! "$computed" =~ ^sha256-[A-Za-z0-9+/]+=$ ]]; then
            echo "unexpected cargoHash: ${computed}" >&2
            exit 1
          fi
          echo "hash=${computed}" >> "$GITHUB_OUTPUT"
          echo "Computed cargoHash ${computed}"

      - name: Update flake.nix and push
        id: publish
        shell: bash
        env:
          COMPUTED: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          current="$(python3 -c '
          import re, pathlib, sys
          text = pathlib.Path("flake.nix").read_text()
          found = re.findall(r"cargoHash = \"(sha256-[^\"]+)\"", text)
          if len(found) != 1:
              sys.exit(f"expected one cargoHash in flake.nix, found {len(found)}")
          print(found[0])
          ')"
          echo "flake.nix cargoHash ${current}"

          if [ "$current" = "$COMPUTED" ]; then
            echo "cargoHash already matches; not pushing"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### cargoHash"
              echo
              echo "\`${current}\` already matches Cargo.lock. No push."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CURRENT="$current" python3 -c '
          import os, pathlib, sys
          path = pathlib.Path("flake.nix")
          text = path.read_text()
          old = os.environ["CURRENT"]
          new = os.environ["COMPUTED"]
          needle = f"cargoHash = \"{old}\""
          if text.count(needle) != 1:
              sys.exit("cargoHash assignment not found exactly once")
          path.write_text(text.replace(needle, f"cargoHash = \"{new}\"", 1))
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if [ "$(git diff --cached --name-only)" != "flake.nix" ]; then
            echo "refusing to commit unexpected files" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git -c commit.gpgsign=false commit -m "fix: refresh cargoHash for the updated Cargo.lock"
          sha="$(git rev-parse HEAD)"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            # Force-move the tag that triggered the release. Do not push the
            # branch: master is allowed to stay on the previous hash.
            if [ "$(git cat-file -t "refs/tags/${tag}")" = tag ]; then
              msg="$(git tag -l --format='%(contents:subject)' "$tag")"
              if [ -z "$msg" ]; then
                msg="Release ${tag}"
              fi
              printf '%s\n' "$msg" > "$RUNNER_TEMP/tag-subject"
              git -c tag.gpgsign=false tag -f -a "$tag" "$sha" -F "$RUNNER_TEMP/tag-subject"
            else
              git tag -f "$tag" "$sha"
            fi
            git push --force origin "refs/tags/${tag}"
            moved="force-moved ${tag}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
            moved="fast-forwarded ${GITHUB_REF_NAME}"
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### cargoHash"
            echo
            echo "Updated \`${current}\` to \`${COMPUTED}\` and ${moved} to \`${sha}\`."
          } >> "$GITHUB_STEP_SUMMARY"
