name: Login window

# Builds and tests the optional login window (login-helper/), which has its
# own workspace and needs WebKitGTK 6. Kept separate from ci.yml so that the
# WebKitGTK install only runs when the login window or the parts of the
# library it uses change.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - login-helper/**
      - locales/**
      - src/i18n.rs
      - src/paths.rs
      - src/config.rs
      - Cargo.toml
      - .github/workflows/login-helper.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: login-helper-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Check and unit tests
    if: github.event.pull_request.draft != true
    # ubuntu-24.04 ships WebKitGTK 6.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: login-helper
          cache-on-failure: true

      - name: Install GTK 4, libadwaita and WebKitGTK 6 headers
        run: |
          echo 'force-unsafe-io' | sudo tee /etc/dpkg/dpkg.cfg.d/unsafe-io >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev pkg-config

      - name: Type-check
        run: cargo check --manifest-path login-helper/Cargo.toml --all-targets --locked

      - name: Unit tests
        run: cargo test --manifest-path login-helper/Cargo.toml --locked
