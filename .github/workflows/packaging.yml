name: Packaging

# Builds every non-Nix artifact on the Enterprise Linux 9 baseline
# (glibc 2.34) and smoke-tests it. Smoke also runs the hidden
# --print-child-env probe so AppImage children do not inherit bundled
# LD_LIBRARY_PATH / GTK paths.
#
#   pull request   -> same quick build and smoke as master when packaging,
#                     dependencies or sources change. Build only: no login,
#                     no push, no release.
#   push to master -> one quick build, smoke-tested on three distributions
#   release.yml    -> called with full=true: the full distribution matrix
#   manual run     -> quick by default, full with the `full` input
#
# This workflow only builds and uploads the `linux-packages` artifact. It never
# touches a GitHub release; release.yml publishes.

on:
  pull_request:
    paths:
      - .github/workflows/packaging.yml
      - packaging/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - crates/**
      - assets/**
      - data/**
      - locales/**
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - flake.nix
      - flake.lock
      - .envrc
      - .github/workflows/flatpak.yml
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      full:
        description: Smoke test the full distribution matrix instead of three images.
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Smoke test the full distribution matrix instead of three images.
        type: boolean
        default: false
      ref:
        description: Commit to check out. release.yml passes github.sha. Empty checks out the triggering commit.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages (EL9 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # dnf, rustup and nfpm rarely change; cache that layer on its own so a
      # source-only commit does not reinstall the whole toolchain. A failed
      # cache export (for example on fork pull requests) must not fail the run.
      - name: Cache EL9 toolchain layer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packaging/linux/Dockerfile
          target: toolchain
          outputs: type=cacheonly
          cache-from: type=gha,scope=el9-toolchain
          cache-to: type=gha,mode=max,scope=el9-toolchain,ignore-error=true

      - name: Build deb, rpm, pacman and AppImage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packaging/linux/Dockerfile
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=el9-toolchain

      - name: List packages
        run: ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: Smoke test (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Quick: the EL9 baseline (rpm), a current deb distribution and Arch
        # (pacman). Full: oldest baselines (glibc 2.34 / 2.35 / 2.36) and
        # current releases.
        image: ${{ fromJSON(inputs.full
          && '["almalinux:9","ubuntu:22.04","debian:12","ubuntu:24.04","debian:13","fedora:latest","archlinux:latest","opensuse/tumbleweed:latest"]'
          || '["almalinux:9","ubuntu:24.04","archlinux:latest"]') }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq ca-certificates >/dev/null; fi
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed ca-certificates >/dev/null; fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: packaging/linux
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist

      - name: Install, start, and check child environment
        run: bash packaging/linux/smoke.sh dist
