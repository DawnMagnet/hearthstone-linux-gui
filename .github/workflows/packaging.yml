name: Packaging

# Builds every non-Nix artifact on the Enterprise Linux 9 baseline
# (glibc 2.34) and smoke-tests it on the oldest and newest mainstream
# distributions. Smoke also runs the hidden --print-child-env probe so
# AppImage children do not inherit bundled LD_LIBRARY_PATH / GTK paths.
#
# To keep pull requests quick, documentation-only and Nix-only changes skip
# this workflow, the EL9 toolchain layer comes from the GitHub Actions layer
# cache, and pull requests smoke-test one distribution per package format
# (rpm, deb, pacman). Pushes to master and manual runs use the full matrix.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - flake.nix
      - flake.lock
      - .envrc
      - .github/workflows/flatpak.yml
      - .github/workflows/release.yml
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages (EL9 baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # dnf, rustup and nfpm rarely change; cache that layer on its own so a
      # source-only commit does not reinstall the whole toolchain. A failed
      # cache export (for example on fork pull requests) must not fail the run.
      - name: Cache EL9 toolchain layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/Dockerfile
          target: toolchain
          outputs: type=cacheonly
          cache-from: type=gha,scope=el9-toolchain
          cache-to: type=gha,mode=max,scope=el9-toolchain,ignore-error=true

      - name: Build deb, rpm, pacman and AppImage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/Dockerfile
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=el9-toolchain

      - name: List packages
        run: ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke test (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: the EL9 baseline (rpm), a current deb distribution and
        # Arch (pacman). Everything else: oldest baselines (glibc 2.34 / 2.35 /
        # 2.36) and current releases.
        image: ${{ fromJSON(github.event_name == 'pull_request'
          && '["almalinux:9","ubuntu:24.04","archlinux:latest"]'
          || '["almalinux:9","ubuntu:22.04","debian:12","ubuntu:24.04","debian:13","fedora:latest","archlinux:latest","opensuse/tumbleweed:latest"]') }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq ca-certificates >/dev/null; fi
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed ca-certificates >/dev/null; fi

      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Install, start, and check child environment
        run: bash packaging/linux/smoke.sh dist
