name: CI

# Pull-request checks for the launcher workspace. No packages are built here.
# packaging.yml builds deb/rpm/pacman/AppImage on master, and release.yml
# builds a release. The Nix package is .github/workflows/nix.yml.
#
# On a non-draft pull request this job:
#   - checks rustfmt,
#   - checks the GTK 4.6 / libadwaita 1.1 / relm4 gnome_42 feature ceiling
#     (.github/ui-baseline.env),
#   - runs clippy -D warnings, which also type-checks the workspace,
#   - runs every workspace test: library, binaries, tests/apprun.rs, doctests,
#     and the stub crates under crates/.
#
# tests/apprun.rs executes packaging/appimage/AppRun, so that path is a trigger.
# MSRV is a separate matrix workflow (.github/workflows/msrv.yml): each manifest
# supplies its own rust-version. Docs-only changes are not. Drafts are skipped
# until marked ready, and a newer push to the same pull request cancels the
# older run. Debug info and
# incremental artifacts are off: they only make the cache slower to restore.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - crates/**
      - tests/**
      - locales/**
      - assets/**
      - data/icons/**
      - packaging/appimage/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/ui-baseline.env
      - .github/scripts/**
      - .github/workflows/ci.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Format, lint, and test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check UI feature ceiling
        run: python3 .github/scripts/check-ui-baseline.py --require gtk4,libadwaita,relm4

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Headless. ui/text.rs skips language_switch_updates_the_open_window
      # unless DISPLAY or WAYLAND_DISPLAY is set. With a display that test
      # holds i18n::LANG_LOCK (via LanguageHold) for the whole GTK run, and
      # the default parallel harness can deadlock against other tests that
      # take the same lock. Hosted runners have no display; strip it if an
      # image starts exporting one. If this step still hangs, switch it to
      # `cargo test --workspace --locked -- --test-threads=1`.
      - name: Test workspace
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo test --workspace --locked
