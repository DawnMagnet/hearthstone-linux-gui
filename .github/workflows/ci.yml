name: CI

# The only check that runs on pull requests: type-check everything (GUI
# included) and run the unit tests. No packages are built here. packaging.yml
# builds one quick set on every push to master, and release.yml builds
# everything for v* tags.
#
# Kept cheap on purpose:
#   - only Rust-relevant paths trigger it (docs, packaging, Nix and other
#     workflows do not),
#   - draft pull requests are skipped until they are marked ready,
#   - a newer push to the same pull request cancels the older run,
#   - no debug info and no incremental artifacts, which are useless in CI and
#     only make the cache bigger and slower to restore.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - crates/**
      - tests/**
      - locales/**
      - assets/**
      - data/icons/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/ci.yml
      - .github/actions/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Check and unit tests
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust

      # `check` stops before code generation and linking, which is enough to
      # catch GUI compile errors without a full build. Running it first fails
      # fast on compile errors before the test build starts.
      - name: Type-check workspace, GUI and tests
        run: cargo check --workspace --all-targets --locked

      # The binary's unit tests cover the login window's process handling and
      # the browser openers; the GTK headers installed above are enough for
      # them. Integration tests are covered by the packaging jobs.
      - name: Unit tests
        run: cargo test -p hearthstone-linux-gui --lib --bins --locked
