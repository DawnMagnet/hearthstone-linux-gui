version: 2
# Routine version updates: at most one grouped PR per ecosystem per month.
# The groups apply to version updates only, so security updates are not
# grouped and still open right away, one PR each.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
      - /login-helper
    schedule:
      interval: monthly
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
