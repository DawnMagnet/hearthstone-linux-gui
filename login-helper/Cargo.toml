# Optional Battle.net login window for hearthstone-linux-gui.
#
# A separate program with its own workspace and lock file, so the launcher,
# its release packages and its Cargo.lock never depend on WebKitGTK. The
# launcher uses it when it is installed and falls back to the system browser
# otherwise. Build it with:
#
#     cargo build --release --locked --manifest-path login-helper/Cargo.toml
#
# It needs GTK 4, libadwaita and WebKitGTK 6 (libwebkitgtk-6.0-dev,
# webkitgtk6.0-devel).

[package]
name = "hearthstone-linux-gui-login"
version = "0.4.0"
rust-version = "1.88"
edition = "2021"
license = "MIT"
description = "Optional Battle.net login window for hearthstone-linux-gui"

[dependencies]
# No dependency on the launcher crate: the launcher passes the language and
# the translated texts, so this lock file never goes stale when the
# launcher's dependencies change.
# webkit6 0.6 needs gtk4 0.11, which would raise this crate's MSRV above 1.88
# and the GTK 4.6 baseline. Keep gtk4 0.10, libadwaita 0.8 and webkit6 0.5.
gtk = { package = "gtk4", version = "0.10" }
adw = { package = "libadwaita", version = "0.8" }
webkit6 = "0.5"

[workspace]

[profile.release]
strip = "symbols"
