<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <clipPath id="round">
      <circle cx="128" cy="122" r="100"/>
    </clipPath>
    <radialGradient id="wall" cx="0.5" cy="0.6" r="0.75">
      <stop offset="0" stop-color="#a8632c"/>
      <stop offset="0.6" stop-color="#6a3a19"/>
      <stop offset="1" stop-color="#3a1d0b"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3013"/>
      <stop offset="1" stop-color="#341907"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a39a8e"/>
      <stop offset="1" stop-color="#6b635a"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2f6b"/>
      <stop offset="1" stop-color="#3f6fc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9964f"/>
      <stop offset="1" stop-color="#7a4318"/>
    </linearGradient>
    <radialGradient id="body" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="0.45" stop-color="#1d2026"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="belly" cx="0.42" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde4"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc83a"/>
      <stop offset="1" stop-color="#f08c12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8793a"/>
      <stop offset="1" stop-color="#7a3f17"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7a25c"/>
      <stop offset="1" stop-color="#c8793a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eedfc2"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8ef0"/>
      <stop offset="1" stop-color="#1b4fb0"/>
    </linearGradient>
  </defs>

  <!-- tavern interior behind Tux, an original drawing -->
  <g clip-path="url(#round)">
    <rect x="20" y="14" width="216" height="216" fill="url(#wall)"/>
    <!-- wall planks -->
    <path d="M20 96 H236 M20 150 H236" stroke="#3a1d0b" stroke-width="2" opacity="0.35"/>

    <!-- fireplace on the left -->
    <path d="M22 204 V112 Q22 84 52 84 Q82 84 82 112 V204z" fill="url(#stone)"/>
    <path d="M22 132 H82 M22 160 H82 M22 186 H82 M52 84 V112 M38 132 V160 M66 132 V160 M52 160 V186" stroke="#4d463f" stroke-width="2" opacity="0.6"/>
    <path d="M32 204 V128 Q32 106 52 106 Q72 106 72 128 V204z" fill="#1d0f08"/>
    <circle cx="52" cy="176" r="40" fill="url(#glow)"/>
    <path d="M38 200 Q30 176 44 160 Q44 174 52 170 Q48 150 60 138 Q60 156 68 166 Q76 180 66 200z" fill="#f2691b"/>
    <path d="M44 200 Q40 184 50 174 Q52 184 56 180 Q56 168 62 176 Q68 188 60 200z" fill="#ffd23f"/>

    <!-- window on the right -->
    <path d="M182 150 V96 Q182 70 206 70 Q230 70 230 96 V150z" fill="#341907"/>
    <path d="M188 144 V96 Q188 76 206 76 Q224 76 224 96 V144z" fill="url(#night)"/>
    <circle cx="214" cy="92" r="6" fill="#fff4c2"/>
    <circle cx="196" cy="104" r="1.500" fill="#ffffff"/>
    <circle cx="200" cy="88" r="1.200" fill="#ffffff"/>
    <path d="M206 76 V144 M188 112 H224" stroke="#341907" stroke-width="4"/>
    <!-- shelf with a mug -->
    <rect x="180" y="150" width="56" height="7" rx="2" fill="url(#beam)"/>
    <rect x="200" y="162" width="18" height="22" rx="3" fill="#c9a26a"/>
    <path d="M218 167 Q228 167 228 174 Q228 181 218 181" fill="none" stroke="#c9a26a" stroke-width="4"/>
    <rect x="200" y="162" width="18" height="6" rx="3" fill="#fff6e0"/>

    <!-- ceiling beams and lanterns -->
    <rect x="20" y="14" width="216" height="26" fill="url(#beam)"/>
    <rect x="20" y="38" width="216" height="3" fill="#1d0f08" opacity="0.5"/>
    <path d="M66 40 V56 M190 40 V56" stroke="#1d0f08" stroke-width="2"/>
    <circle cx="66" cy="66" r="24" fill="url(#glow)"/>
    <rect x="59" y="56" width="14" height="18" rx="3" fill="#ffd76a" stroke="#341907" stroke-width="2.500"/>
    <circle cx="190" cy="66" r="24" fill="url(#glow)"/>
    <rect x="183" y="56" width="14" height="18" rx="3" fill="#ffd76a" stroke="#341907" stroke-width="2.500"/>
  </g>
  <!-- round wooden frame -->
  <circle cx="128" cy="122" r="100" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <circle cx="128" cy="122" r="94" fill="none" stroke="#ffe3a8" stroke-width="1.500" opacity="0.5"/>

  <!-- Tux -->
  <g transform="translate(128 214) scale(0.860) translate(-128 -214)">
  <ellipse cx="128" cy="150" rx="62" ry="70" fill="url(#body)"/>
  <ellipse cx="128" cy="86" rx="46" ry="44" fill="url(#body)"/>
  <ellipse cx="128" cy="160" rx="41" ry="52" fill="url(#belly)"/>
  <!-- glossy highlight on the head -->
  <ellipse cx="110" cy="58" rx="20" ry="9" fill="#ffffff" opacity="0.22" transform="rotate(-24 110 58)"/>

  <!-- eyes, looking down at the cards -->
  <ellipse cx="112" cy="80" rx="10" ry="13" fill="#ffffff"/>
  <ellipse cx="144" cy="80" rx="10" ry="13" fill="#ffffff"/>
  <circle cx="115" cy="85" r="5" fill="#101114"/>
  <circle cx="141" cy="85" r="5" fill="#101114"/>
  <circle cx="116.500" cy="83.200" r="1.600" fill="#ffffff"/>
  <circle cx="142.500" cy="83.200" r="1.600" fill="#ffffff"/>

  <!-- beak -->
  <path d="M106 100 Q128 88 150 100 Q140 112 128 112 Q116 112 106 100z" fill="url(#beak)"/>
  <path d="M110 101 Q128 107 146 101 Q138 114 128 114 Q118 114 110 101z" fill="#e07b0c"/>
  <ellipse cx="122" cy="96" rx="9" ry="2.600" fill="#ffffff" opacity="0.45"/>

  </g>

  <!-- table -->
  <path d="M26 196 Q128 172 230 196 L230 214 Q128 240 26 214z" fill="url(#wood)"/>
  <path d="M26 196 Q128 172 230 196 Q128 220 26 196z" fill="url(#woodTop)"/>
  <path d="M48 196 Q128 180 208 196" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>

  <!-- card played on the table -->
  <g transform="translate(188 201) rotate(14) scale(1 0.42)">
    <rect x="-21" y="-30" width="42" height="60" rx="6" fill="url(#cardBack)" stroke="#f3c64f" stroke-width="3"/>
    <path d="M0 -14 L10 0 L0 14 L-10 0z" fill="#f3c64f"/>
  </g>

  <!-- hand of cards and flippers -->
  <g transform="translate(128 214) scale(0.860) translate(-128 -214)">
  <g transform="translate(98 172) rotate(-24) scale(1.150)">
    <rect x="-20" y="-28" width="42" height="60" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="-21" y="-30" width="42" height="60" rx="6" fill="url(#card)" stroke="#b9851f" stroke-width="3.500"/>
    <path d="M0 -15 L11 0 L0 15 L-11 0z" fill="#2f7fe8"/>
  </g>
  <g transform="translate(128 164) scale(1.150)">
    <rect x="-20" y="-28" width="42" height="60" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="-21" y="-30" width="42" height="60" rx="6" fill="url(#card)" stroke="#b9851f" stroke-width="3.500"/>
    <circle r="12" fill="#e5533a"/>
    <circle r="5.500" fill="#fffaf0"/>
  </g>
  <g transform="translate(158 172) rotate(24) scale(1.150)">
    <rect x="-20" y="-28" width="42" height="60" rx="6" fill="#000000" opacity="0.28"/>
    <rect x="-21" y="-30" width="42" height="60" rx="6" fill="url(#card)" stroke="#b9851f" stroke-width="3.500"/>
    <path d="M0 -15 L4.400 -4.800 L15 -4.800 L6.400 2 L9.400 12.600 L0 6.400 L-9.400 12.600 L-6.400 2 L-15 -4.800 L-4.400 -4.800z" fill="#3aa35a"/>
  </g>

  <!-- flippers holding the cards -->
  <path d="M70 126 Q48 150 60 186 Q70 206 96 204 Q110 200 106 190 Q88 190 82 168 Q78 148 86 130z" fill="url(#body)"/>
  <path d="M186 126 Q208 150 196 186 Q186 206 160 204 Q146 200 150 190 Q168 190 174 168 Q178 148 170 130z" fill="url(#body)"/>
  <path d="M70 136 Q58 154 64 176" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  </g>
</svg>
